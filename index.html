<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Só o próprio app e o script do Google. frame-ancestors não funciona em meta.
         'wasm-unsafe-eval' deixa compilar WebAssembly (IA local, Tarefa 21); não libera eval de JavaScript. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; object-src 'none'; base-uri 'self'"
    />
    <meta name="theme-color" content="#e8eae3" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icones/icone.svg" />
    <link rel="apple-touch-icon" href="/icones/apple-touch-icon.png" />
    <title>Central de Comando</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
