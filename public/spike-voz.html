<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste de voz (descartável)</title>
<!-- DESCARTÁVEL: spike da V02 (Tarefa 1). Nada daqui entra no app; apagar depois do teste. -->
<style>
  body { font: 16px/1.4 system-ui, sans-serif; margin: 0; padding: 16px; background: #f4f6f2; color: #1f2a22; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.aviso { margin: 0 0 16px; color: #5a6b5e; font-size: 14px; }
  button { display: block; width: 100%; padding: 14px; margin: 8px 0; font-size: 17px; border: 0; border-radius: 10px; background: #5e7f66; color: #fff; }
  button.parar { background: #a3524a; }
  .caixa { background: #fff; border-radius: 10px; padding: 12px; margin: 12px 0; min-height: 48px; white-space: pre-wrap; }
  .rotulo { font-size: 13px; color: #5a6b5e; margin-top: 12px; }
  #log { font-family: ui-monospace, monospace; font-size: 13px; max-height: 40vh; overflow: auto; }
  audio { width: 100%; margin-top: 8px; }
</style>
</head>
<body>
<h1>Teste de voz</h1>
<p class="aviso">Página descartável, só para testar o celular. Nada é guardado.</p>

<button id="bReconhecer">1. Reconhecer fala</button>
<button id="bGravar">2. Gravar áudio</button>
<button id="bJuntos">3. Os dois juntos</button>

<div class="rotulo">Texto reconhecido (ao vivo)</div>
<div class="caixa" id="texto"></div>

<div class="rotulo">Gravação</div>
<div class="caixa" id="gravacao">—</div>

<div class="rotulo">Registro</div>
<div class="caixa" id="log"></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var t0 = Date.now();
  function log(msg) {
    var s = ((Date.now() - t0) / 1000).toFixed(1) + 's  ' + msg + '\n';
    $('log').textContent = s + $('log').textContent;
  }

  log('Navegador: ' + navigator.userAgent);
  log('Instalado (standalone): ' + (window.matchMedia('(display-mode: standalone)').matches ? 'sim' : 'não'));

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  log('SpeechRecognition: ' + (SR ? 'existe' : 'NÃO existe'));
  log('MediaRecorder: ' + (window.MediaRecorder ? 'existe' : 'NÃO existe'));

  // ---------- reconhecimento ----------
  var rec = null, reconhecendo = false, finalTxt = '';
  function iniciarReconhecimento() {
    if (!SR) { log('ERRO: sem SpeechRecognition'); return false; }
    rec = new SR();
    rec.lang = 'pt-BR';
    rec.continuous = true;
    rec.interimResults = true;
    rec.onstart = function () { log('reconhecimento: começou'); };
    rec.onresult = function (e) {
      var parcial = '';
      for (var i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) finalTxt += e.results[i][0].transcript + ' ';
        else parcial += e.results[i][0].transcript;
      }
      $('texto').textContent = finalTxt + (parcial ? '[' + parcial + ']' : '');
    };
    rec.onerror = function (e) { log('reconhecimento ERRO: ' + e.error + (e.message ? ' — ' + e.message : '')); };
    rec.onend = function () {
      log('reconhecimento: terminou');
      if (reconhecendo) {
        log('reconhecimento: reiniciando');
        try { rec.start(); } catch (err) { log('reinício falhou: ' + err.message); }
      }
    };
    reconhecendo = true;
    finalTxt = '';
    $('texto').textContent = '';
    try { rec.start(); } catch (err) { log('start falhou: ' + err.message); reconhecendo = false; return false; }
    return true;
  }
  function pararReconhecimento() {
    reconhecendo = false;
    if (rec) try { rec.stop(); } catch (err) {}
  }

  // ---------- gravação ----------
  var gravador = null, pedacos = [], inicioGrav = 0, relogio = null, fluxo = null;
  function iniciarGravacao() {
    if (!navigator.mediaDevices || !window.MediaRecorder) { log('ERRO: sem gravação'); return Promise.resolve(false); }
    return navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
      fluxo = s;
      pedacos = [];
      gravador = new MediaRecorder(s);
      gravador.ondataavailable = function (e) { if (e.data && e.data.size) pedacos.push(e.data); };
      gravador.onstop = function () {
        clearInterval(relogio);
        var blob = new Blob(pedacos, { type: gravador.mimeType || 'audio/webm' });
        var seg = ((Date.now() - inicioGrav) / 1000).toFixed(1);
        $('gravacao').innerHTML = '';
        $('gravacao').appendChild(document.createTextNode(seg + ' s, ' + (blob.size / 1024).toFixed(1) + ' KB, ' + blob.type));
        var a = document.createElement('audio');
        a.controls = true;
        a.src = URL.createObjectURL(blob);
        $('gravacao').appendChild(a);
        fluxo.getTracks().forEach(function (t) { t.stop(); });
        log('gravação: parou (' + seg + ' s)');
      };
      gravador.start(1000);
      inicioGrav = Date.now();
      relogio = setInterval(function () {
        $('gravacao').textContent = 'gravando… ' + Math.round((Date.now() - inicioGrav) / 1000) + ' s';
      }, 500);
      log('gravação: começou (' + (gravador.mimeType || 'tipo padrão') + ')');
      return true;
    }).catch(function (err) {
      log('gravação ERRO: ' + err.name + ' — ' + err.message);
      return false;
    });
  }
  function pararGravacao() {
    if (gravador && gravador.state !== 'inactive') gravador.stop();
  }

  // ---------- botões ----------
  function alternar(botao, rotuloLigado, rotuloDesligado, ligar, desligar) {
    var ligado = false;
    botao.onclick = function () {
      if (!ligado) {
        Promise.resolve(ligar()).then(function (ok) {
          if (ok === false) return;
          ligado = true;
          botao.textContent = rotuloLigado;
          botao.classList.add('parar');
        });
      } else {
        desligar();
        ligado = false;
        botao.textContent = rotuloDesligado;
        botao.classList.remove('parar');
      }
    };
  }
  alternar($('bReconhecer'), 'Parar reconhecimento', '1. Reconhecer fala', iniciarReconhecimento, pararReconhecimento);
  alternar($('bGravar'), 'Parar gravação', '2. Gravar áudio', iniciarGravacao, pararGravacao);
  alternar($('bJuntos'), 'Parar os dois', '3. Os dois juntos',
    function () { return iniciarGravacao().then(function (ok) { return iniciarReconhecimento() && ok; }); },
    function () { pararReconhecimento(); pararGravacao(); });

  // Teste (a): reconhecer sem toque prévio
  if (location.hash === '#auto') {
    log('modo #auto: tentando reconhecer sem toque');
    iniciarReconhecimento();
  }
})();
</script>
</body>
</html>
