<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste de IA local</title>
<style>
body{margin:0;padding:16px;background:#E8EAE3;color:#262B26;font:15px/1.45 system-ui,sans-serif}
h1{font:400 30px/1.1 Georgia,serif;margin:0 0 6px}
.caixa{background:#fff;border-radius:20px;padding:14px 16px;margin:12px 0}
button{min-height:44px;padding:0 16px;border:0;border-radius:99px;background:#E0966F;color:#35170A;font:600 15px system-ui;margin:4px 6px 4px 0}
button[disabled]{opacity:.5}
#estado{font-weight:600}
.r{border-top:1px solid #ECEEE7;padding:8px 0}
.ok{color:#2F6B4A;font-weight:600}.erro{color:#8A3350;font-weight:600}
code{font-size:12.5px;word-break:break-word;color:#4A524A}
</style>
</head>
<body>
<h1>Teste de IA local</h1>
<p>Teste descartável. As frases não saem deste aparelho; só o modelo é baixado.</p>
<div class="caixa">
  <button data-m="E2B">Testar Gemma 4 E2B</button>
  <button data-m="E4B">Testar Gemma 4 E4B</button>
  <p id="estado">Escolha um modelo. O download leva alguns minutos.</p>
  <p id="placar"></p>
</div>
<div class="caixa" id="saida"></div>
<script type="module">
import {Engine} from 'https://cdn.jsdelivr.net/npm/@litert-lm/core/+esm';

const SISTEMA=`Você organiza a agenda de um doutorando. Hoje é quinta-feira, 5 de novembro de 2026.
Transforme a frase em itens. Responda SOMENTE com JSON, sem explicação, neste formato:
{"itens":[{"tipo":"tarefa","titulo":"","sala":"","quando":"","inicio":"","fim":""}]}

tipo: "compromisso" somente se a frase já diz o dia e a hora em que aquilo acontece. Todo o resto é "tarefa".
"Marcar reunião" sem dia e hora é uma tarefa.
titulo: curto, começa com verbo quando houver, sem "adicione" e sem a data.
quando: as palavras de data da frase, como "hoje", "amanhã", "sexta". "do dia" significa "hoje". Sem data, use "".
inicio e fim: horas no formato 11:00. Sem hora, use "".
sala, escolha uma:
- Doutoramento: tese, relatórios e trabalho do próprio doutorado
- Investigação: projetos de pesquisa, como Aurora e Horizonte, dados, artigos
- Aulas: disciplinas que ele ensina, turmas, avaliações, secretaria
- Orientações: alunas que ele orienta
- Pessoal: saúde, família, amigos, assuntos pessoais
- Casa: consertos, compras e cuidados da casa
- Não sei: quando a frase fala de pessoa desconhecida e nada indica a sala

Pessoas conhecidas: Marina (aluna de orientação, sala Orientações), Prof. Souza (orientador do doutorado, sala Doutoramento).
Se a frase tiver vários pedidos, crie um item para cada um e ignore hesitações.

Exemplo: "Tenho que trocar a torneira da cozinha amanhã"
{"itens":[{"tipo":"tarefa","titulo":"Trocar a torneira da cozinha","sala":"Casa","quando":"amanhã","inicio":"","fim":""}]}`;

const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const T=(sala,palavra,o={})=>({tipo:'tarefa',sala,palavra,...o});
const CASOS=[
 {f:'Adicione em atividades do dia mandar mensagem para Renata',e:[T('Não sei','renata',{quando:'hoje'})],dele:1},
 {f:'Adicione reunião sobre o projeto na sexta feira com inicio às 11:00 e termino 12:00',e:[{tipo:'compromisso',sala:'Investigação',palavra:'reuni',quando:'sexta',inicio:'11:00',fim:'12:00'}],dele:1},
 {f:'Adicione Revisar paragrafo do relatório 1 nas tarefas do doutoramento',e:[T('Doutoramento','relatorio',{quando:''})],dele:1},
 {f:'Preciso parafusar o apoio do banheiro',e:[T('Casa','parafus',{quando:''})],dele:1},
 {f:'Marcar reunião com a Marina',e:[T('Orientações','marina',{quando:''})],dele:1},
 {f:'Comprar lâmpada para a cozinha',e:[T('Casa','lampada')]},
 {f:'Preparar a aula de estatística para terça',e:[T('Aulas','aula',{quando:'terca'})]},
 {f:'Reunião com a Marina quinta às 15h',e:[{tipo:'compromisso',sala:'Orientações',palavra:'marina',quando:'quinta',inicio:'15:00'}]},
 {f:'Lembrar de enviar os dados do campo para a equipe Aurora amanhã',e:[T('Investigação','campo',{quando:'amanha'})]},
 {f:'então é, eu tava pensando aqui, preciso, preciso é revisar o capítulo da Marina até sexta, e aí também tem que ligar pro dentista, isso, marcar o dentista, ah e comprar parafuso pro banheiro',e:[T('Orientações','capitulo',{quando:'sexta'}),T('Pessoal','dentista'),T('Casa','parafuso')]}
];

function nota(c,itens){
  const falhas=[];
  if(!Array.isArray(itens))return['JSON inválido'];
  if(itens.length!==c.e.length)falhas.push(`${itens.length} itens, esperava ${c.e.length}`);
  for(const e of c.e){
    const a=itens.find(i=>norm(i.titulo).includes(e.palavra));
    if(!a){falhas.push(`sem item "${e.palavra}"`);continue}
    if(a.tipo!==e.tipo)falhas.push(`tipo ${a.tipo}`);
    if(norm(a.sala)!==norm(e.sala))falhas.push(`sala ${a.sala}`);
    if(e.quando!==undefined&&(e.quando===''?norm(a.quando)!=='':!norm(a.quando).includes(e.quando)))falhas.push(`quando "${a.quando}"`);
    for(const k of['inicio','fim'])if(e[k]&&a[k]!==e[k])falhas.push(`${k} ${a[k]}`);
  }
  return falhas;
}
const lerJson=t=>{const m=t.match(/\{[\s\S]*\}/);try{return JSON.parse(m[0]).itens}catch{return null}};
const $=id=>document.getElementById(id);
window.resultado=null;

async function rodar(m){
  document.querySelectorAll('button').forEach(b=>b.disabled=true);
  $('saida').innerHTML='';$('placar').textContent='';
  const r={modelo:m,ua:navigator.userAgent,casos:[]};window.resultado=r;
  try{
    const t0=performance.now();
    $('estado').textContent=`Baixando e carregando ${m}...`;
    const engine=await Engine.create({model:`hf://litert-community/gemma-4-${m}-it-litert-lm`,mainExecutorSettings:{maxNumTokens:2048}});
    r.cargaSeg=Math.round((performance.now()-t0)/1000);
    let certos=0;
    for(const [n,c] of CASOS.entries()){
      $('estado').textContent=`Frase ${n+1} de ${CASOS.length}...`;
      const conv=await engine.createConversation({preface:{messages:[{role:'system',content:SISTEMA}]},sessionConfig:{maxOutputTokens:400}});
      const t1=performance.now();
      const resp=await conv.sendMessage(c.f);
      const seg=+((performance.now()-t1)/1000).toFixed(1);
      const txt=resp.content?.[0]?.text??'';
      const itens=lerJson(txt),falhas=nota(c,itens);
      if(!falhas.length)certos++;
      r.casos.push({frase:c.f,dele:!!c.dele,seg,falhas,itens,txt:itens?undefined:txt});
      const d=document.createElement('div');d.className='r';
      d.innerHTML=`<span class="${falhas.length?'erro':'ok'}">${falhas.length?'Errou':'Certo'}</span> (${seg} s) ${c.f.slice(0,80)}<br><code></code>`;
      d.querySelector('code').textContent=falhas.length?falhas.join('; ')+' | '+JSON.stringify(itens??txt):JSON.stringify(itens);
      $('saida').append(d);
      await conv.delete?.();
    }
    r.certos=certos;r.total=CASOS.length;r.fim=true;
    $('estado').textContent='Terminado.';
    $('placar').textContent=`${m}: ${certos} de ${CASOS.length} certas. Carga: ${r.cargaSeg} s.`;
    await engine.delete();
  }catch(e){r.erro=String(e?.stack||e);r.fim=true;$('estado').textContent='Falhou: '+e}
  document.querySelectorAll('button').forEach(b=>b.disabled=false);
}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>rodar(b.dataset.m));
window.rodar=rodar;
const q=new URLSearchParams(location.search).get('m');if(q)rodar(q);
</script>
</body>
</html>
