name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Instala, testa e constrói com permissão só de leitura: os pacotes de
  # terceiros que rodam aqui não podem publicar o site (C-22).
  construir:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico inteiro: o teste que vigia dados pessoais no histórico corre aqui (C-26).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Testes de ponta a ponta no app construído; falha aqui não publica.
      - run: npm run e2e
        env:
          CI: true
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Lê a configuração do Pages: precisa da permissão pages, que só este job tem.
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
